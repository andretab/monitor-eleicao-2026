# Avisa por e-mail (comentário no aviso nº 1) quando o analista na nuvem publica boletim ou acha pesquisa.
# Os commits do robô das pesquisas não disparam este fluxo (regra do GitHub para o token interno);
# por isso aquele robô manda o próprio alerta.
name: alertas

on:
  push:
    branches: [main]
    paths:
      - dados/boletins.json
      - dados/pesquisas.json
  workflow_dispatch:  # botão manual: manda um alerta de teste para conferir se o e-mail chega

permissions:
  contents: read
  issues: write

jobs:
  avisar:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Alerta de teste (só no botão manual)
        if: github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh issue comment 1 --body "@andretab teste de alerta do Monitor Eleição 2026. Se este aviso chegou por e-mail, os alertas estão funcionando. https://eleicao.andrefreitas.eng.br"
      - name: Alerta por e-mail se houver novidade
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python scripts/alerta.py "${{ github.event.before }}" "${{ github.sha }}" > alerta.md
          if [ -s alerta.md ]; then gh issue comment 1 --body-file alerta.md; else echo "nada novo para avisar"; fi
