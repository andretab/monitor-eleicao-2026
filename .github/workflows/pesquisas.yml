# Lê as pesquisas do 2º turno na Wikipédia de hora em hora e publica no GitHub Pages.
# De hora em hora porque o agendador do GitHub atrasa e às vezes pula execuções: rodando mais vezes,
# o atraso real fica pequeno. Havendo novidade, comenta no aviso nº 1 e o GitHub manda e-mail.
name: pesquisas

on:
  schedule:
    - cron: "15 * * * *"
  workflow_dispatch:

permissions:
  contents: write
  issues: write

concurrency:
  group: pesquisas

jobs:
  atualizar:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install lxml
      - run: echo "ANTES=$(git rev-parse HEAD)" >> "$GITHUB_ENV"
      - run: echo "TEM_CHAVE=${{ secrets.ANTHROPIC_API_KEY != '' && 'sim' || 'nao' }}" >> "$GITHUB_ENV"
      - run: python scripts/atualizar_pesquisas.py
      - name: Pesquisas do RN (governador)
        continue-on-error: true  # se a página do RN mudar de formato, o nacional segue publicando
        run: python scripts/atualizar_pesquisas_rn.py
      - name: Publica se mudou
        run: |
          if git diff --quiet; then echo "sem mudanças"; exit 0; fi
          git config user.name "monitor-eleicao"
          git config user.email "monitor@users.noreply.github.com"
          git add -A dados painel
          git commit -m "Pesquisas atualizadas da Wikipédia"
          git pull --rebase origin main
          git push
      - name: Boletim pela API do Claude se entrou pesquisa nova
        if: env.TEM_CHAVE == 'sim'
        continue-on-error: true  # sem boletim, o site e o alerta seguem
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          pip install -q anthropic
          python scripts/analista_api.py --corrida presidente --se-novidade "$ANTES" || true
          python scripts/analista_api.py --corrida rn --se-novidade "$ANTES" || true
          if git diff --quiet; then exit 0; fi
          git add -A dados painel
          git commit -m "Boletim do analista (pesquisa nova)"
          git pull --rebase origin main
          git push
      - name: Alerta por e-mail se houver novidade
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python scripts/alerta.py "$ANTES" HEAD > alerta.md
          if [ -s alerta.md ]; then gh issue comment 1 --body-file alerta.md; else echo "nada novo para avisar"; fi
