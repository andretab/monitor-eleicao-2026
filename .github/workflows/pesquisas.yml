# Lê as pesquisas do 2º turno na Wikipédia a cada 3 horas e publica no GitHub Pages.
name: pesquisas

on:
  schedule:
    - cron: "15 */3 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pesquisas

jobs:
  atualizar:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install lxml
      - run: python scripts/atualizar_pesquisas.py
      - name: Publica se mudou
        run: |
          if git diff --quiet; then echo "sem novidades"; exit 0; fi
          git config user.name "monitor-eleicao"
          git config user.email "monitor@users.noreply.github.com"
          git commit -am "Pesquisas atualizadas da Wikipédia"
          git push
